<div class="article-card" *ngIf="article">
  <div class="article-card-category">{{article.category}}</div>
  <div
    class="article-card-image"
    style="background-image: url({{serverStatikPath+article.image}})"
  ></div>
  <div class="article-card-title">{{article.title}}</div>
  <div class="article-card-text">
   {{article.description}}
  </div>
  <div class="article-card-link">
    <a routerLink="/articles/{{article.url}}">Читать дальше</a>
  </div>
</div>
