<section class="signup" [formGroup]="signupForm">
  <div class="container">
    <div class="auth-form">
      <div class="auth-title">Регистрация на сайте</div>
      <div class="auth-inputs">
        <div class="auth-input">
          <input
            type="text"
            class="input"
            placeholder="Ваше имя"
            formControlName="name"
            [ngStyle]="{
              'border-color':
                signupForm.get('name')?.invalid &&
                (signupForm.get('name')?.dirty ||
                  signupForm.get('name')?.touched)
                  ? 'red'
                  : ''
            }"
          />
        </div>
        <div
          *ngIf="
            signupForm.get('name')?.invalid &&
            (signupForm.get('name')?.dirty || signupForm.get('name')?.touched)
          "
        >
          <div
            class="input-error"
            *ngIf="signupForm.get('name')?.errors?.['required']"
          >
            Введите имя
          </div>
          <div
            class="input-error"
            *ngIf="signupForm.get('name')?.errors?.['pattern']"
          >
            Некорректное имя
          </div>
        </div>
        <div class="auth-input">
          <input
            type="text"
            class="input"
            placeholder="Электронная почта"
            formControlName="email"
            [ngStyle]="{
              'border-color':
                signupForm.get('email')?.invalid &&
                (signupForm.get('email')?.dirty ||
                  signupForm.get('email')?.touched)
                  ? 'red'
                  : ''
            }"
          />
        </div>
        <div
          *ngIf="
            signupForm.get('email')?.invalid &&
            (signupForm.get('email')?.dirty || signupForm.get('email')?.touched)
          "
        >
          <div
            class="input-error"
            *ngIf="signupForm.get('email')?.errors?.['required']"
          >
            Введите email
          </div>
          <div
            class="input-error"
            *ngIf="signupForm.get('email')?.errors?.['email']"
          >
            Некорректный email
          </div>
        </div>
        <div class="auth-input">
          <input
            type="password"
            class="input"
            placeholder="Пароль"
            formControlName="password"
            [ngStyle]="{
              'border-color':
                signupForm.get('password')?.invalid &&
                (signupForm.get('password')?.dirty ||
                  signupForm.get('password')?.touched)
                  ? 'red'
                  : ''
            }"
          />
        </div>
        <div
          *ngIf="
            signupForm.get('password')?.invalid &&
            (signupForm.get('password')?.dirty ||
              signupForm.get('password')?.touched)
          "
        >
          <div
            class="input-error"
            *ngIf="signupForm.get('password')?.errors?.['required']"
          >
            Введите пароль
          </div>
          <div
            class="input-error"
            *ngIf="signupForm.get('password')?.errors?.['pattern']"
          >
            Некорректный пароль
          </div>
        </div>
        <div class="auth-checkbox">
          <input type="checkbox" id="agree" formControlName="agree" />
          <label for="agree">
            <span>
              Я принимаю условия
              <a routerLink="/policy" >
                пользовательского соглашения
              </a>
              и даю
              <a routerLink="/policy" fragment="aggreement">
                согласие на обработку персональных данных.
              </a>
            </span>
          </label>
        </div>
      </div>
      <div class="auth-button">
        <button
          class="button"
          [disabled]="signupForm.invalid"
          (click)="signup()"
        >
          Зарегистрироваться
        </button>
      </div>
      <div class="auth-link">
        Уже есть аккаунт? <a routerLink="/login">Войдите</a>
      </div>
    </div>

    <div class="auth-image">
      <img src="./assets/images/page/signup.png" alt="Регистрация" />
    </div>
  </div>
</section>
